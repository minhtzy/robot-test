[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-testkit"
version = "0.1.0"
description = "VS Code and MCP toolkit for ROS2 robot build, lint, simulation, control, and log analysis."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
robot-testkit = "robot_testkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

