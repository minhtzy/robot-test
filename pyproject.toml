[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-testkit"
version = "0.1.0"
description = "VS Code and MCP toolkit for ROS2 robot build, lint, simulation, control, and log analysis."
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=6.0.1"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0,<9.0.0"
]

[project.scripts]
robot-testkit = "robot_testkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["robot_testkit*"]
